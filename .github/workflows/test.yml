name: test

# 보안 불변식 회귀 가드 (tests/security-invariants.test.mjs) — 경제성 fail-closed·결제
# 로그 마스킹·XSS·server-only 경계·GPS 무신고 불변식이 리팩터로 되돌아가면 여기서 실패한다.
# (2026-08-02: GPS 불변식 테스트가 "주석과 동급"이 되지 않도록 push마다 강제 실행하는 게이트)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      # 테스트는 node 내장 러너 + 소스 문자열 검사라 전체 의존성 설치가 필요 없다.
      # 단 lib/log-sanitize.ts 가 server-only 를 import 하므로(2026-08-17 PG점검)
      # 그 마커 패키지 하나만 설치한다. (--conditions react-server 로 빈 모듈 해석)
      - name: server-only 마커 패키지 설치
        run: npm install --no-save server-only
      - name: 보안 불변식 테스트
        run: npm test

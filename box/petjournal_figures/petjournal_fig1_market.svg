<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="900" height="480" fill="#f5f8f7"/>
  <text x="450" y="56" text-anchor="middle" font-size="30" font-weight="700" fill="#1f2933">반려 시장은 꽉 찼고, 돌봄 시장은 비었다</text>
  <text x="450" y="88" text-anchor="middle" font-size="17" fill="#6b7684">같은 '반려'인데, 한쪽 매대만 텅 비어 있다</text>

  <!-- Left: saturated -->
  <text x="245" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2933">반려용품 시장</text>
  <rect x="150" y="160" width="190" height="250" rx="12" fill="#ffffff" stroke="#cdd7d3" stroke-width="2"/>
  <g fill="#8a9a94">
    <rect x="166" y="176" width="158" height="30" rx="5"/>
    <rect x="166" y="214" width="158" height="30" rx="5"/>
    <rect x="166" y="252" width="158" height="30" rx="5"/>
    <rect x="166" y="290" width="158" height="30" rx="5"/>
    <rect x="166" y="328" width="158" height="30" rx="5"/>
    <rect x="166" y="366" width="158" height="28" rx="5"/>
  </g>
  <text x="245" y="440" text-anchor="middle" font-size="17" font-weight="700" fill="#6b7684">이미 포화 · 레드오션</text>

  <!-- Right: empty -->
  <text x="655" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2933">길고양이 돌봄</text>
  <rect x="560" y="160" width="190" height="250" rx="12" fill="#ffffff" stroke="#cdd7d3" stroke-width="2"/>
  <g fill="none" stroke="#dce4e1" stroke-width="2" stroke-dasharray="5 5">
    <rect x="576" y="176" width="158" height="30" rx="5"/>
    <rect x="576" y="214" width="158" height="30" rx="5"/>
    <rect x="576" y="252" width="158" height="30" rx="5"/>
    <rect x="576" y="290" width="158" height="30" rx="5"/>
  </g>
  <rect x="576" y="366" width="158" height="28" rx="5" fill="#2f7d6e"/>
  <text x="655" y="385" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">도시공존</text>
  <text x="655" y="440" text-anchor="middle" font-size="17" font-weight="700" fill="#2f7d6e">아무도 안 건 매대</text>
</svg>
